name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh && rsync -a --exclude .git --exclude .github --exclude .wrangler --exclude build.sh --exclude README.md --exclude .gitignore ./ dist/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 780130702a3ae99b9836209710a0ab6f
          command: pages deploy dist --project-name haruharu-pay --branch main --commit-dirty=true
